services:
  citywatch:
    build: .
    restart: unless-stopped
    init: true
    environment:
      CITYWATCH_INTERVAL_SECONDS: ${CITYWATCH_INTERVAL_SECONDS:-3600}
      CITYWATCH_SEND_EMAIL: ${CITYWATCH_SEND_EMAIL:-false}
      CITYWATCH_EMAIL_INTERVAL_SECONDS: ${CITYWATCH_EMAIL_INTERVAL_SECONDS:-86400}
      MAILJET_API_KEY: ${MAILJET_API_KEY}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY}
      CITYWATCH_FROM_EMAIL: ${CITYWATCH_FROM_EMAIL}
      CITYWATCH_FROM_NAME: ${CITYWATCH_FROM_NAME:-CityWatch}
      CITYWATCH_TO_EMAIL: ${CITYWATCH_TO_EMAIL}
    volumes:
      - citywatch-data:/app/var
  citywatch-slack:
    build: .
    command: ["python", "-m", "citywatch.slack_service", "run"]
    restart: unless-stopped
    init: true
    environment:
      CITYWATCH_SLACK_ENABLED: ${CITYWATCH_SLACK_ENABLED:-false}
      CITYWATCH_SLACK_INTERVAL_SECONDS: ${CITYWATCH_SLACK_INTERVAL_SECONDS:-86400}
      CITYWATCH_SLACK_TEAM_ID: ${CITYWATCH_SLACK_TEAM_ID:-T031RQ3EFAP}
      CITYWATCH_SLACK_CHANNEL_ID: ${CITYWATCH_SLACK_CHANNEL_ID:-C08M32G5XDL}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    volumes:
      - citywatch-data:/app/var
volumes:
  citywatch-data:
